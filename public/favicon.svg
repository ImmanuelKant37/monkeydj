<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="neonPinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle for crisp tab display in both dark and light browser themes -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="2" />

  <!-- Headphones Arc (Headband) -->
  <path d="M12 34 C12 14, 52 14, 52 34" stroke="url(#headphoneGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Monkey Ears -->
  <circle cx="15" cy="35" r="7" fill="#3b1d68" stroke="#ec4899" stroke-width="1.5" />
  <circle cx="15" cy="35" r="3.5" fill="#f472b6" />

  <circle cx="49" cy="35" r="7" fill="#3b1d68" stroke="#ec4899" stroke-width="1.5" />
  <circle cx="49" cy="35" r="3.5" fill="#f472b6" />

  <!-- Monkey Head -->
  <circle cx="32" cy="36" r="17" fill="#29134a" stroke="#a855f7" stroke-width="1.5" />

  <!-- Monkey Muzzle/Snout -->
  <ellipse cx="32" cy="41" rx="12" ry="9" fill="#fae8ff" />

  <!-- Eyes with Sparkle -->
  <ellipse cx="26" cy="33" rx="3.5" ry="4" fill="#0f172a" />
  <circle cx="25" cy="31.5" r="1.5" fill="#ffffff" />

  <ellipse cx="38" cy="33" rx="3.5" ry="4" fill="#0f172a" />
  <circle cx="37" cy="31.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="32" cy="39" rx="2.5" ry="1.8" fill="#6b21a8" />

  <!-- DJ Smile -->
  <path d="M27 43.5 Q32 48 37 43.5" stroke="#6b21a8" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- DJ Headphones Ear Cushions (Over ears) -->
  <rect x="7" y="27" width="8" height="16" rx="4" fill="url(#headphoneGrad)" stroke="#38bdf8" stroke-width="1" />
  <rect x="9" y="30" width="4" height="10" rx="2" fill="#090d16" />

  <rect x="49" y="27" width="8" height="16" rx="4" fill="url(#headphoneGrad)" stroke="#38bdf8" stroke-width="1" />
  <rect x="51" y="30" width="4" height="10" rx="2" fill="#090d16" />

  <!-- DJ Music Note Top Accent -->
  <path d="M30 20 L32 16 L34 20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>
